name: Fetch feeds and rebuild site

on:
  schedule:
    - cron: "17 */4 * * *"      # каждые 4 часа (UTC) — 16 лент, ежечасно много шума
  workflow_dispatch:             # кнопка «запустить сейчас» на вкладке Actions
  push:
    branches: [main]
    paths:                       # ваши правки в очереди и данных — пересобрать
      - "queue/**"
      - "posts/**"
      - "data/**"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet feedparser

      - name: Fetch feeds
        if: github.event_name != 'push'
        run: python scripts/fetch_feeds.py

      - name: Install Playwright package
        id: playwright_pkg
        continue-on-error: true
        run: |
          pip install --quiet playwright
          echo "version=$(python -m playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Кэш держит сам браузер (десятки-сотни МБ), не pip-пакет — тот ставится
      # заново каждый раз, это быстро. Ключ — по версии Playwright: если она
      # сменится, старый кэш просто не подойдёт и скачается свежий бинарник.
      - name: Cache Playwright browser
        if: steps.playwright_pkg.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright_pkg.outputs.version }}

      - name: Install Chromium
        if: steps.playwright_pkg.outcome == 'success'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      # Резолвит ссылки Google News на первоисточник для черновиков в queue/.
      # Не установился Playwright, не открылась страница, не нашлась
      # картинка — resolve_links.py сам ничего не ломает и не падает, файлы
      # остаются как были. Поэтому continue-on-error здесь не нужен.
      - name: Resolve Google News links
        run: python scripts/resolve_links.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name  "inflight-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нечего коммитить — изменений нет."
            exit 0
          fi
          git commit -m "auto: fetch feeds and rebuild ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Параллельный прогон (двойная доставка push-вебхука, ручной запуск
          # поверх планового) мог запушить раньше нас — обычный push тогда
          # отклоняется, и раньше это валило весь workflow с письмом об
          # ошибке, хотя сборка прошла нормально. Вместо падения — до пяти
          # попыток: подтянуть то, что уже ушло, и перебазировать наш коммит
          # поверх. При конфликте -X theirs при rebase — это, в отличие от
          # merge, НАША переигрываемая версия, не чужая уже запушенная.
          # То есть побеждает более свежий прогон — и это ровно то, что
          # нужно: все файлы тут сгенерированы скриптами заново, старая
          # копия ничем не ценнее новой. Проверено на живой гонке двух
          # клонов — обе новые записи сохранились, конфликтная строка
          # взяла версию перебазируемого коммита.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "запушено с попытки $i"
              exit 0
            fi
            echo "попытка $i отклонена, подтягиваю main и перебазируюсь"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "перебазирование не удалось"
              exit 1
            fi
            sleep $((RANDOM % 4 + 1))
          done
          echo "не удалось запушить после 5 попыток"
          exit 1
