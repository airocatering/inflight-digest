name: Morning digest

on:
  schedule:
    # История: сначала 1 слот, потом 2, потом (2026-08-30) 15 слотов каждые
    # ~20 минут в одном пятичасовом окне — идея была "больше попыток =
    # надёжнее". Не сработало: проверка за 30 авг — 5 сен показала, что при
    # 15 настроенных срабатываниях реально стартует ОДНО в сутки, и время
    # уплывает всё дальше (10:38 → 06:54 UTC, при окне 02:00–06:59). Похоже,
    # GitHub схлопывает слишком частое расписание в один прогон вместо
    # честных 15 попыток.
    #
    # У соседнего проекта (ryanair-monitor, 2 слота с разносом 9 часов)
    # опоздание тоже есть (обычно 2–7 часов), но оба слота реально СРАБАТЫВАЮТ
    # как независимые прогоны — просто с опозданием, не схлопываясь в один.
    # Разница явно в промежутке между слотами, не в их количестве как
    # таковом. Поэтому здесь — 4 слота с разносом 6 часов вместо 15 с
    # разносом 20 минут. Цель уже не "точно к 05:00" (это не гарантирует ни
    # одна раскладка scheduled cron на этом аккаунте), а "хотя бы раз в
    # сутки, из нескольких независимых попыток, а не одной". send_digest.py
    # по-прежнему помнит дату последней отправки (data/digest_sent.json) —
    # какой бы слот ни сработал первым, письмо уйдёт только одно.
    - cron: "4 2,8,14,20 * * *"
  workflow_dispatch:            # кнопка «прислать сейчас»

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python scripts/send_digest.py

      - name: Commit sent-date marker
        run: |
          git config user.name  "inflight-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/digest_sent.json
          if git diff --cached --quiet; then
            echo "Нечего коммитить — маркер не менялся (письмо не отправлялось)."
            exit 0
          fi
          git commit -m "auto: mark digest sent ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Тот же приём, что и в publish.yml: параллельный прогон мог
          # запушить раньше нас. -X theirs при rebase — наша (более свежая)
          # версия побеждает при конфликте, это единственный файл здесь и
          # ценность имеет только дата в нём.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "запушено с попытки $i"
              exit 0
            fi
            echo "попытка $i отклонена, подтягиваю main и перебазируюсь"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "перебазирование не удалось"
              exit 1
            fi
            sleep $((RANDOM % 4 + 1))
          done
          echo "не удалось запушить после 5 попыток"
          exit 1
