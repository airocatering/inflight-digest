name: Morning digest

on:
  schedule:
    # Один-два слота оказались недостаточной страховкой. За 25–30 августа
    # 2026 planned-триггер digest.yml то опаздывал на 70 минут, то пропадал
    # на весь день (следующий прогон сам всплыл через 10+ часов), то из двух
    # слотов срабатывал только один — и с опозданием в 6+ часов. Это не
    # особенность конкретной минуты (:04), а общая ненадёжность scheduled
    # cron у GitHub Actions на этом репозитории — от него не откупиться
    # выбором одной «правильной» минуты.
    #
    # Вместо одного-двух слотов — 15 попыток каждые ~20 минут в течение
    # пятичасового окна (02:00–06:59 UTC = 05:00–09:59 Киев летом).
    # send_digest.py помнит дату последней ОТПРАВКИ (data/digest_sent.json)
    # и не шлёт письмо второй раз за день, так что почти все 15 запусков —
    # это секунда на чтение маркера и выход. Реально письмо уйдёт с первой
    # попытки, которая вообще смогла стартовать.
    - cron: "12,32,52 2-6 * * *"
  workflow_dispatch:            # кнопка «прислать сейчас»

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python scripts/send_digest.py

      - name: Commit sent-date marker
        run: |
          git config user.name  "inflight-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/digest_sent.json
          if git diff --cached --quiet; then
            echo "Нечего коммитить — маркер не менялся (письмо не отправлялось)."
            exit 0
          fi
          git commit -m "auto: mark digest sent ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Тот же приём, что и в publish.yml: параллельный прогон мог
          # запушить раньше нас. -X theirs при rebase — наша (более свежая)
          # версия побеждает при конфликте, это единственный файл здесь и
          # ценность имеет только дата в нём.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "запушено с попытки $i"
              exit 0
            fi
            echo "попытка $i отклонена, подтягиваю main и перебазируюсь"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort
              echo "перебазирование не удалось"
              exit 1
            fi
            sleep $((RANDOM % 4 + 1))
          done
          echo "не удалось запушить после 5 попыток"
          exit 1
