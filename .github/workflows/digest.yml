name: Morning digest

on:
  schedule:
    # 02:04 UTC = 05:04 в Киеве летом (UTC+3). Минута :04 (не :00) намеренно —
    # тот же урок из ryanair-monitor: GitHub Actions чаще теряет
    # scheduled-запуски на круглые минуты из-за общей перегрузки. На :00 этот
    # workflow не сработал вообще ни разу с момента создания.
    - cron: "4 2 * * *"
  workflow_dispatch:            # кнопка «прислать сейчас»

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python scripts/send_digest.py
